name: r300_corr50_l2
description: in-fold |corr| top-50 + L2 logistic C=0.05
model_code: research/r300_e1_pair_screen.py
pipeline:
  scaler: standard
  selector:
    name: corr_topk
    k: 50
  model:
    name: logreg
    params:
      C: 0.05
      l1_ratio: 0.0
      solver: liblinear
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false

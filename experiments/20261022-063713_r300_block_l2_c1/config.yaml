name: r300_block_l2_c1
description: L2 logistic C=1 on the 13-column block
model_code: research/r300_e1_pair_screen.py
pipeline:
  scaler: standard
  selector:
    name: fixed_columns
    columns:
    - 8
    - 15
    - 26
    - 30
    - 46
    - 49
    - 64
    - 67
    - 77
    - 80
    - 98
    - 100
    - 112
  model:
    name: logreg
    params:
      C: 1.0
      l1_ratio: 0.0
      solver: liblinear
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false

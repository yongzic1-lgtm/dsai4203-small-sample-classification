name: r102_gmm2_conn20_polish
description: K=2 full GMM on the 20 label-free connected features (PCA, 12 dims)
model_code: research/r102_official_candidates.py + research/lib_mix.py
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: true

name: r102_selftrain_qda99
description: self-training QDA on confident pseudo-labels (|p-0.5|>0.49), 5 rounds
model_code: research/r102_official_candidates.py + research/lib_mix.py
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026

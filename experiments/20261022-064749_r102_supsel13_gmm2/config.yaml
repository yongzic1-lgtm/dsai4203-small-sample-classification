name: r102_supsel13_gmm2
description: supervised in-fold selection (top-13 marginal LRT on fold labels) + K=2
  GMM
model_code: research/r102_official_candidates.py + research/lib_mix.py
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: true

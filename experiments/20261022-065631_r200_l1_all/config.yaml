name: r200_l1_all
description: L1 logistic, all 150, nested C
model_code: research/r200_sup_linear.py + research/lib_sup.py
group: supervised-linear
features: all 150
tuning: C in [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]
n_configs: 10
inner_cv: RepeatedStratifiedKFold on the 200-row training fold (see lib_sup.Tuned)
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false

name: r200_en_block
description: elastic-net logistic (saga), block(in-fold highvar), nested C x l1_ratio
model_code: research/r200_sup_linear.py + research/lib_sup.py
group: supervised-linear
features: block(in-fold highvar)
tuning: C in [0.01, 0.03, 0.1, 0.3, 1.0, 3.0] x l1_ratio in [0.2, 0.5, 0.8]
n_configs: 18
inner_cv: RepeatedStratifiedKFold on the 200-row training fold (see lib_sup.Tuned)
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false

name: r200_l1_corrk
description: L1 logistic on in-fold top-k |corr| features, nested k x C
model_code: research/r200_sup_linear.py + research/lib_sup.py
group: supervised-linear
features: corr-topk(in-fold)
tuning: k in [5, 10, 20, 40] x C in [0.01, 0.03, 0.1, 0.3, 1.0, 3.0]
n_configs: 24
inner_cv: RepeatedStratifiedKFold on the 200-row training fold (see lib_sup.Tuned)
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false

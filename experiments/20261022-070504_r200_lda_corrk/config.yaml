name: r200_lda_corrk
description: shrinkage LDA on in-fold top-k |corr| features, nested k
model_code: research/r200_sup_linear.py + research/lib_sup.py
group: supervised-linear
features: corr-topk(in-fold)
tuning: k in [5, 10, 20, 40]
n_configs: 4
inner_cv: RepeatedStratifiedKFold on the 200-row training fold (see lib_sup.Tuned)
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false

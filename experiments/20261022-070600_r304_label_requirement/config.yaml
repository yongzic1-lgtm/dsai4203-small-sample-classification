n_subsets: 50
models:
  gmm2_hv:
    scaler: none
    model:
      name: transductive_gmm
      params:
        columns: highvar
        n_components: 2
        source: raw
  qda_hv:
    scaler: none
    model:
      name: subspace_qda
      params:
        reg_param: 0.1

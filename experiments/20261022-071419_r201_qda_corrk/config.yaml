name: r201_qda_corrk
description: QDA on in-fold top-k |corr| features of all 150, nested k x reg_param
model_code: research/r201_sup_quadratic.py + research/lib_sup.py
group: supervised-generative
features: corr-topk(in-fold)
tuning: k in [5, 10, 13, 20, 30] x reg_param in [0.5, 0.3, 0.1]
n_configs: 15
inner_cv: RepeatedStratifiedKFold on the 200-row training fold (see lib_sup.Tuned)
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false

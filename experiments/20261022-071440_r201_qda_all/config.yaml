name: r201_qda_all
description: QDA on all 150 features, nested reg_param
model_code: research/r201_sup_quadratic.py + research/lib_sup.py
group: supervised-generative
features: all 150
tuning: reg_param in [0.99, 0.95, 0.9, 0.8, 0.7, 0.5, 0.3]
n_configs: 7
inner_cv: RepeatedStratifiedKFold on the 200-row training fold (see lib_sup.Tuned)
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false

name: r201_gnb_block_tt
description: Gaussian naive Bayes on R003's train+test block (SubspaceModel)
model_code: research/r201_sup_quadratic.py + research/lib_sup.py
group: supervised-generative
features: block(train+test highvar, train+test standardised)
tuning: none
n_configs: 1
inner_cv: null
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: true

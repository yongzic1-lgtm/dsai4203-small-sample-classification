name: r201_svm_block
description: RBF-SVM on in-fold block, nested C x gamma (decision_function scores)
model_code: research/r201_sup_quadratic.py + research/lib_sup.py
group: supervised-kernel
features: block(in-fold highvar)
tuning: C in [0.1, 1.0, 10.0, 100.0] x gamma in [0.01, 0.03, 0.1, 0.3]
n_configs: 16
inner_cv: RepeatedStratifiedKFold on the 200-row training fold (see lib_sup.Tuned)
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false

name: r201_knn_block
description: kNN on in-fold block, nested k x weights
model_code: research/r201_sup_quadratic.py + research/lib_sup.py
group: supervised-kernel
features: block(in-fold highvar)
tuning: k in [41, 25, 15, 9, 5] x weights in ['uniform', 'distance']
n_configs: 10
inner_cv: RepeatedStratifiedKFold on the 200-row training fold (see lib_sup.Tuned)
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false

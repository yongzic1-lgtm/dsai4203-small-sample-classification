name: r202_gpc_ard_block_tt
description: GPC, C*RBF ARD, R003's train+test block (SubspaceModel), ML-II hyperparameters
model_code: research/r202_sup_gpc.py + research/lib_sup.py
group: supervised-kernel
features: block(train+test highvar, train+test standardised)
tuning: ML-II (marginal likelihood)
n_configs: 1
inner_cv: null
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: true

name: r207_l1_block_wide
description: L1 logistic, in-fold block, nested C up to 1e4
model_code: research/r207_sup_linear_widegrid.py + research/lib_sup.py
group: supervised-linear
features: block(in-fold highvar)
tuning: C in [0.1, 0.3, 1.0, 3.0, 10.0, 30.0, 100.0, 300.0, 1000.0, 3000.0, 10000.0]
n_configs: 11
inner_cv: RepeatedStratifiedKFold on the 200-row training fold (see lib_sup.Tuned)
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false

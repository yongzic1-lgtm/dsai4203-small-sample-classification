name: r203_lgbm_all
description: LightGBM(300, lr 0.03, 7 leaves, min_child 10, subsample 0.8, colsample
  0.5, L2 1), all 150
model_code: research/r203_sup_trees.py + research/lib_sup.py
group: supervised-trees
features: all 150
tuning: none
n_configs: 1
inner_cv: null
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false

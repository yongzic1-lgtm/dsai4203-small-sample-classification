name: r105_gmm2_block_mle
description: K=2 full GMM, block PCA basis, reg_covar 1e-9 (unregularised MLE), EM
  polished
model_code: research/r105_*.py + research/lib_mix.py
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: true

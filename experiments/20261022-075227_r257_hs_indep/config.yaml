name: r257_hs_indep
description: regularised-horseshoe logistic on a QR-reduced identifiable design of
  the 150 features
model_code: research/r257_hs_identifiability.py + research/lib_fm.py
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false
prior:
  type: regularised horseshoe
  p0: 10
  slab_scale: 2.0
  slab_df: 4.0
mcmc:
  sampler: NUTS
  warmup: 500
  samples: 500
  chains: 1
versions:
  torch: null
  tabpfn: null
  tabicl: null
  jax: 0.10.2
  jaxlib: 0.10.2
  numpyro: 0.22.0
  huggingface_hub: null
  scikit-learn: 1.9.1
  numpy: 2.4.6
  pandas: 3.0.6
  scipy: 1.17.1
code_sha:
  lib_fm.py: 2b2319bcbfbd701c
  r257_hs_identifiability.py: deb6c2a8213c9e30

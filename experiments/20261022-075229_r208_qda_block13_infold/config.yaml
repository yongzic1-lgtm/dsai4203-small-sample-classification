name: r208_qda_block13_infold
description: QDA on the in-fold block with ratio 1.65 (~ the 13 train+test block columns),
  nested reg
model_code: research/r208_sup_qda_followup.py + research/lib_sup.py
group: supervised-generative
features: block(in-fold highvar, ratio 1.65 ~ exact 13 columns)
tuning: reg_param in [0.9, 0.7, 0.5, 0.3, 0.2, 0.1, 0.05, 0.03, 0.01, 0.003, 0.001]
n_configs: 11
inner_cv: RepeatedStratifiedKFold on the 200-row training fold (see lib_sup.Tuned)
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false
note: ratio 1.65 was picked by comparing in-fold blocks with the label-free train+test
  block

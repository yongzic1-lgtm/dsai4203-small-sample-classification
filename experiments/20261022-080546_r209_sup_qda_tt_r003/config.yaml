name: r209_sup_qda_tt_r003
description: supervised QDA reg 0.003 on the train+test block (base of pair A)
model_code: research/r209_semisup_followup.py + research/lib_sup.py
group: supervised-generative
features: block(train+test highvar, train+test standardised)
tuning: none
n_configs: 1
inner_cv: null
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: true
note: reg 0.003 = modal nested choice of R201 qda_block (informed by R201)

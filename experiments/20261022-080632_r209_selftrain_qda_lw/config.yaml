name: r209_selftrain_qda_lw
description: SelfTraining(QDA Ledoit-Wolf), threshold 0.99, 20,000 rows, no tuning
model_code: research/r209_semisup_followup.py + research/lib_sup.py
group: semi-supervised
features: block(train+test highvar) + 20,000 unlabeled rows
tuning: none
n_configs: 1
inner_cv: null
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: true

name: r210_sup_qda_tt_lw
description: supervised QDA-LW on the train+test block (base of pair C)
model_code: research/r210_sup_tiebreak_lw.py + research/lib_sup.py
group: supervised-generative
features: block(train+test highvar, train+test standardised)
tuning: none (analytic Ledoit-Wolf shrinkage)
n_configs: 1
inner_cv: null
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: true

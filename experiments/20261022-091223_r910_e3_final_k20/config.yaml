name: r910_e3_final_k20
description: 'R910 re-run of the E3 final model (20261022-063908_e3_leakage): scaler
  + CorrelationTopK(20, pearson) + logreg C=0.1; honest CV; test_pred = refit on 250
  rows'
model_code: extensions/e3_leakage/run.py (load_config, with_selector) + ssc.models.build_pipeline
reproduces_run: 20261022-063908_e3_leakage
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: refit
n_jobs: 1
uses_unlabeled_test_features: false
pipeline:
  scaler: standard
  model:
    name: logreg
    params:
      C: 0.1
      l1_ratio: 0.0
      solver: liblinear
  random_state: 0
  selector:
    name: corr_topk
    k: 20
    method: pearson

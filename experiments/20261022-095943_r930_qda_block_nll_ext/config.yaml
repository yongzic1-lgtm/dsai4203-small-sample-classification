name: r930_qda_block_nll_ext
description: QDA on in-fold block, nested reg (grid extended below the r210 edge)
  by inner log-loss
model_code: research/r930_qda_reg_edge.py + research/lib_sup.py
group: supervised-generative
features: block(in-fold highvar)
tuning: reg_param in [0.9, 0.7, 0.5, 0.3, 0.2, 0.1, 0.05, 0.03, 0.01, 0.003, 0.001,
  0.0003, 0.0001, 3e-05, 1e-05], inner neg_log_loss
n_configs: 15
inner_cv: RepeatedStratifiedKFold on the 200-row training fold (see lib_sup.Tuned)
cv:
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026
  test_size: 0.2
  shuffle: true
  stratify: true
test_pred: fold_mean
uses_unlabeled_test_features: false

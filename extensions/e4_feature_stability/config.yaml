# E4 - stability of the |corr| feature ranking under bootstrap resampling.
# Used by extensions/e4_feature_stability/run.py. Keys under `quick:` override
# the rest (deep merge) when the script is run with --quick.

name: e4_feature_stability

hypothesis: >
  A few features enter the bootstrap top-k in nearly every resample, the rest at
  about the chance rate k/150; the sorted frequency curve drops sharply after them
  and the drop position does not move with k. Whether those stable features are
  also worth keeping is decided only by honest CV (selection repeated inside each
  fold); the naive comparison (stable set chosen on all 250 rows) is biased upward.
  Real data (written before the full run, ext34 2026-10-22): R001 found 7 features with
  |corr| 0.34-0.40 (98, 17, 100, 112, 80, 77, 46), the next one 0.24 (49), the rest
  <= 0.18, so the drop should sit at m* ~ 7 for every k >= 7 (at k = 5 the 7 strong
  features share 5 places). Six of the seven are in the label-free 13-feature
  high-variance block, so the stable set should be a strict subset of the block plus
  feature 17; with L2 logistic regression the stable set alone should beat all 150.

bootstrap:                          # ranking only, no model
  n_boot: 2000                      # resamples of 250 rows drawn with replacement (>= several hundred; ext34: 1000 -> 2000)
  # ext34: 13 added = size of the label-free high-variance block (R001)
  ks: [5, 10, 13, 20]               # top-k sizes; the same resamples are used for every k
  method: pearson                   # |corr| type: pearson | spearman
  seed: 2026                        # resample b uses the b-th draw of default_rng(seed) (same as ssc)

drop:                               # objective "sharp drop" rules, m*(k) = number of features above the drop
  # Rule reported as m*(k): gap | half | binom | perm. All four are always computed.
  # perm is the default because the gap rule splits a group of strong features when
  # k < group size (synthetic: gap gives 2 at k=5 but 7 at k=10/20), and the binomial
  # rule uses the wrong null for bootstrap-of-one-sample (it flags many noise features).
  primary_rule: perm
  threshold: 0.5                    # half rule: frequency >= threshold
  binom_alpha: 0.05                 # binom rule: above the Bonferroni (150 features) upper bound of Bin(B, k/150)/B
  null_permutations: 50             # perm rule: permuted-label bootstrap curves give a rank-wise envelope (ext34: 20 -> 50)
  null_n_boot: null                 # resamples per permutation; null = same as bootstrap.n_boot
  null_quantile: 0.95               # perm rule: leading positions above this quantile of the null curve
  label_seed: 7                     # permutation p uses default_rng(label_seed + p)

# Base model for the usefulness test, ssc.models.build_pipeline format, WITHOUT a
# selector: run.py adds FixedColumns / StabilityTopK / CorrelationTopK itself.
pipeline:
  scaler: standard
  model:
    name: logreg
    # sklearn 1.9: `penalty` is deprecated; l1_ratio 0 = L2, 1 = L1.
    params: {C: 0.1, l1_ratio: 0.0, solver: liblinear}
  random_state: 0                   # model seed, fixed -> spread comes from the splits only

usefulness:
  ks: null                          # k values to test; null = bootstrap.ks
  threshold: 0.5                    # stable set = frequency >= threshold (all-rows and in-fold alike)
  n_boot_fold: 500                  # StabilityTopK resamples inside each fold (ext34: 200 -> 500, less selection noise)
  fold_seed: 0                      # StabilityTopK random_state (fixed for every fold)

cv:                                 # must equal project.yaml official_cv (identical splits for all variants)
  kind: kfold
  n_splits: 5
  n_repeats: 20
  seed: 2026

quick:                              # --quick: smoke test
  bootstrap: {n_boot: 200, ks: [5, 10]}
  drop: {null_permutations: 3}
  usefulness: {n_boot_fold: 50}
  cv: {n_repeats: 3}
